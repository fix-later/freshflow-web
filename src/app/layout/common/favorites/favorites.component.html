<ng-container *transloco="let t">
    <!-- Favorites trigger (drawer panel lives at the layout root) -->
    <button
        class="ff-header-icon text-default relative flex h-10 w-10 items-center justify-center rounded-full hover:bg-hover"
        type="button"
        (click)="favoritesService.toggleDrawer()"
        [attr.aria-label]="t('header.favorites')"
        [matTooltip]="t('header.favorites')"
        [class.ff-fav-badge--bump]="justAdded()"
    >
        <!-- On the icon, not the button — see the cart trigger. -->
        <mat-icon
            class="icon-size-6"
            [class.ff-fav-icon--bump]="justAdded()"
            [svgIcon]="'heroicons_outline:heart'"
            [matBadge]="count()"
            [matBadgeHidden]="count() === 0"
            [matBadgeDescription]="t('header.favorites')"
            matBadgeColor="primary"
            matBadgeSize="small"
        ></mat-icon>
    </button>
</ng-container>
