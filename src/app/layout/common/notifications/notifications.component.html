<ng-container *transloco="let t">
    <!-- Notifications toggle -->
    <button
        mat-icon-button
        (click)="openPanel()"
        #notificationsOrigin
        [class.ff-header-icon]="microMotion()"
        [class.ff-header-icon--nudge]="nudging()"
    >
        @if (unreadCount() > 0) {
            <span
                class="absolute left-0 right-0 top-0 flex h-3 items-center justify-center"
            >
                <span
                    class="ml-4 mt-2.5 flex h-4 min-w-4 shrink-0 items-center justify-center rounded-full bg-primary px-1 text-xs font-medium text-on-primary"
                >
                    {{ unreadCount() }}
                </span>
            </span>
        }
        <mat-icon [svgIcon]="'heroicons_outline:bell'"></mat-icon>
    </button>

    <!-- Notifications panel -->
    <ng-template #notificationsPanel>
        <div
            class="fixed inset-0 flex flex-col overflow-hidden shadow-lg sm:static sm:inset-auto sm:w-90 sm:min-w-90 sm:rounded-2xl"
        >
            <!-- Header -->
            <div
                class="flex shrink-0 items-center bg-primary py-4 pl-6 pr-4 text-on-primary"
            >
                <div class="-ml-1 mr-3 sm:hidden">
                    <button mat-icon-button (click)="closePanel()">
                        <mat-icon
                            class="text-current icon-size-5"
                            [svgIcon]="'heroicons_solid:x-mark'"
                        ></mat-icon>
                    </button>
                </div>
                <div class="text-lg font-medium leading-10">
                    {{ t('notifications.title') }}
                </div>
            </div>

            <!-- Content -->
            <div
                class="bg-card relative flex flex-auto flex-col divide-y overflow-y-auto sm:max-h-120"
            >
                @if (loadError(); as message) {
                    <div
                        class="flex flex-col items-start gap-2 px-6 py-5 text-sm text-red-700"
                        role="alert"
                    >
                        <span>{{ message }}</span>
                        <button mat-button type="button" (click)="reload()">
                            {{ t('common.retry') }}
                        </button>
                    </div>
                }

                <!-- Notifications -->
                @for (
                    notification of items();
                    track trackByFn($index, notification)
                ) {
                    <button
                        type="button"
                        class="group flex w-full py-5 pl-6 pr-6 text-left hover:bg-gray-50 dark:hover:bg-black dark:hover:bg-opacity-5"
                        [class.unread]="!notification.isRead"
                        (click)="open(notification)"
                    >
                        <div
                            class="mr-3 mt-1.5 h-2 w-2 shrink-0 rounded-full"
                            [class.bg-primary]="!notification.isRead"
                        ></div>
                        <div class="flex flex-auto flex-col">
                            @if (notification.title) {
                                <div class="line-clamp-1 font-semibold">
                                    {{ notification.title }}
                                </div>
                            }
                            @if (notification.description) {
                                <div class="line-clamp-2">
                                    {{ notification.description }}
                                </div>
                            }
                            @if (
                                notification.type === 'market_session' &&
                                notification.serviceDate
                            ) {
                                <div
                                    class="mt-2 flex w-fit items-center gap-1 rounded-full bg-amber-100 px-2.5 py-1 text-xs font-semibold text-amber-800 dark:bg-amber-900 dark:text-amber-100"
                                >
                                    <mat-icon
                                        class="icon-size-4"
                                        svgIcon="heroicons_outline:calendar-days"
                                    ></mat-icon>
                                    {{
                                        t(
                                            'notifications.marketSession.closedDate'
                                        )
                                    }}:
                                    {{
                                        notification.serviceDate
                                            | date: 'dd/MM/yyyy' : 'UTC'
                                    }}
                                </div>
                            }
                            @if (notification.createdAt) {
                                <div
                                    class="text-secondary mt-2 text-sm leading-none"
                                >
                                    {{
                                        notification.createdAt
                                            | date: 'MMM dd, h:mm a'
                                    }}
                                </div>
                            }
                        </div>
                    </button>
                }

                @if (hasMore()) {
                    <div class="flex justify-center py-3">
                        <button mat-button (click)="loadMore()">
                            {{ t('notifications.loadMore') }}
                        </button>
                    </div>
                }

                <!-- No notifications -->
                @if (!items().length) {
                    <div
                        class="flex flex-auto flex-col items-center justify-center px-8 py-12 sm:justify-start"
                    >
                        <div
                            class="flex h-14 w-14 flex-0 items-center justify-center rounded-full bg-primary-100 dark:bg-primary-600"
                        >
                            <mat-icon
                                class="text-primary-700 dark:text-primary-50"
                                [svgIcon]="'heroicons_outline:bell'"
                            ></mat-icon>
                        </div>
                        <div class="mt-5 text-2xl font-semibold tracking-tight">
                            {{ t('notifications.empty.title') }}
                        </div>
                        <div
                            class="text-secondary mt-1 w-full max-w-60 text-center text-md"
                        >
                            {{ t('notifications.empty.description') }}
                        </div>
                    </div>
                }
            </div>
        </div>
    </ng-template>
</ng-container>
