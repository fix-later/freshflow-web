<!-- Trigger -->
<ng-container *transloco="let t">
    <button
        class="inline-flex items-center gap-1.5 font-medium leading-none"
        type="button"
        (click)="openPanel()"
        [matTooltip]="t('header.market')"
    >
        @if (selected(); as market) {
            <span>{{ t('market.displayName', { name: market.name }) }}</span>
        } @else {
            <span>{{ t('market.choosePrompt') }}</span>
        }
        <mat-icon
            class="text-current icon-size-3.5"
            [svgIcon]="'heroicons_outline:chevron-down'"
        ></mat-icon>
    </button>
</ng-container>

<!-- Popup: the market board -->
<ng-template #marketPickerPanel>
    <ng-container *transloco="let t">
        <div class="ff-mp">
            <!-- Header -->
            <div class="ff-mp__head">
                <!-- A question, not a label: this is the first thing the
                     storefront asks, and the line under it says what picking
                     one does. -->
                <h2 class="ff-mp__title">{{ t('market.dialogTitle') }}</h2>
                <p class="ff-mp__hint">{{ t('market.dialogHint') }}</p>
                <button
                    class="ff-mp__close"
                    mat-icon-button
                    type="button"
                    [attr.aria-label]="t('market.close')"
                    (click)="closePanel()"
                >
                    <mat-icon
                        class="icon-size-5"
                        [svgIcon]="'heroicons_outline:x-mark'"
                    ></mat-icon>
                </button>
            </div>

            @if (loading()) {
                <div class="flex items-center justify-center py-16">
                    <mat-progress-spinner
                        [diameter]="32"
                        [mode]="'indeterminate'"
                    ></mat-progress-spinner>
                </div>
            } @else if (markets().length === 0) {
                <!-- Empty state: the market list could not be loaded -->
                <div
                    class="flex flex-auto flex-col items-center justify-center gap-4 px-6 py-12 text-center"
                >
                    <div
                        class="flex h-16 w-16 items-center justify-center rounded-full bg-primary-50 text-primary dark:bg-primary-500/10"
                    >
                        <mat-icon
                            class="text-current icon-size-8"
                            [svgIcon]="'heroicons_outline:building-storefront'"
                        ></mat-icon>
                    </div>
                    <div>
                        <p class="text-lg font-bold">
                            {{ t('market.empty.title') }}
                        </p>
                        <p class="text-secondary mt-1 text-sm">
                            {{ t('market.empty.description') }}
                        </p>
                    </div>
                    <button
                        mat-flat-button
                        color="primary"
                        type="button"
                        (click)="reload()"
                    >
                        {{ t('market.retry') }}
                    </button>
                </div>
            } @else {
                <!-- The board. No search: a city has a handful of chợ, and a
                     filter over a board this size costs more attention than it
                     saves. -->
                <div class="ff-mp__body">
                    <div class="ff-mp__grid">
                        @for (market of markets(); track market.id) {
                            <button
                                class="ff-mp__card"
                                type="button"
                                [class.ff-mp__card--current]="
                                    market.id === selected()?.id
                                "
                                [attr.aria-current]="
                                    market.id === selected()?.id ? 'true' : null
                                "
                                (click)="select(market)"
                            >
                                @if (market.id === selected()?.id) {
                                    <span class="ff-mp__badge">
                                        <mat-icon
                                            class="text-current icon-size-3.5"
                                            [svgIcon]="
                                                'heroicons_solid:check-circle'
                                            "
                                        ></mat-icon>
                                        {{ t('market.currentBadge') }}
                                    </span>
                                }

                                <!-- The chợ's own artwork, when an admin has
                                     uploaded one; its monogram otherwise. -->
                                <span class="ff-mp__art">
                                    @if (market.imageUrl) {
                                        <img
                                            [src]="market.imageUrl"
                                            [alt]="market.name"
                                            loading="lazy"
                                            decoding="async"
                                        />
                                    } @else {
                                        <span
                                            class="ff-mp__monogram"
                                            aria-hidden="true"
                                            >{{ initials(market.name) }}</span
                                        >
                                    }
                                </span>

                                <span class="ff-mp__card-body">
                                    <span class="ff-mp__name">
                                        {{
                                            t('market.displayName', {
                                                name: market.name,
                                            })
                                        }}
                                    </span>
                                    <span class="ff-mp__rule"></span>

                                    <!-- Only when the record carries one; a
                                         speciality is never invented. -->
                                    @if (market.description) {
                                        <span class="ff-mp__specialty">
                                            {{ market.description }}
                                        </span>
                                    }

                                    @if (market.address) {
                                        <span class="ff-mp__where">
                                            <mat-icon
                                                class="text-current icon-size-4"
                                                [svgIcon]="
                                                    'heroicons_outline:map-pin'
                                                "
                                            ></mat-icon>
                                            <span>{{ market.address }}</span>
                                        </span>
                                    }
                                </span>
                            </button>
                        }
                    </div>
                </div>
            }
        </div>
    </ng-container>
</ng-template>
