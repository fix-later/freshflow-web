<ng-container *transloco="let t">
    <!-- Draft order trigger (drawer panel lives at the layout root) -->
    <button
        class="ff-header-icon text-default relative flex h-10 w-10 items-center justify-center rounded-full hover:bg-hover"
        type="button"
        (click)="draftOrderService.toggleDrawer()"
        [attr.aria-label]="t('header.cart')"
        [matTooltip]="t('header.cart')"
        [class.ff-cart-badge--bump]="justAdded()"
    >
        <!-- The badge rides the icon, not the button: the trigger is a 40px
             target around a 24px glyph, so a badge pinned to the button's
             corner floats away from the cart it is counting. -->
        <mat-icon
            class="ff-cart-icon icon-size-6"
            [class.ff-cart-icon--bump]="justAdded()"
            [svgIcon]="'heroicons_outline:shopping-cart'"
            [matBadge]="count()"
            [matBadgeHidden]="count() === 0"
            [matBadgeDescription]="t('header.cart')"
            matBadgeColor="primary"
            matBadgeSize="small"
        ></mat-icon>
    </button>
</ng-container>
