<!--
  Three layouts, one per area (see specs/ux/NAVIGATION.md § Layout per area):
  `empty` for auth/error screens, `enterprise` for the storefront,
  `dense` for the admin console. The unused Fuse demo layouts were removed.
-->
@if (layout === 'empty') {
    <empty-layout></empty-layout>
}

@if (layout === 'enterprise') {
    <enterprise-layout></enterprise-layout>
}

@if (layout === 'dense') {
    <dense-layout></dense-layout>
}
