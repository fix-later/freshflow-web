<!-- Loading bar -->
<fuse-loading-bar></fuse-loading-bar>

<!-- Navigation -->
<fuse-vertical-navigation
    class="dark bg-gray-900 print:hidden"
    [appearance]="navigationAppearance"
    [mode]="isScreenSmall ? 'over' : 'side'"
    [name]="'mainNavigation'"
    [navigation]="navigation.default"
    [opened]="navigationOpened"
    (openedChanged)="navigationOpened = $event"
>
    <!-- Navigation header hook -->
    <ng-container fuseVerticalNavigationContentHeader>
        <div
            class="admin-dense-logo-header flex h-20 items-center"
            [class.justify-center]="navigationAppearance === 'dense'"
            [class.px-6]="navigationAppearance !== 'dense'"
        >
            @if (navigationAppearance === 'dense') {
                <!-- Collapsed mark; swaps to wordmark on hover via CSS -->
                <img
                    class="admin-dense-logo-mark h-8 w-8"
                    src="images/logo/logo-dark.svg"
                    alt="FreshFlow"
                />
                <img
                    class="admin-dense-logo-primary hidden h-[calc(2rem*1.51685281)] w-auto"
                    src="images/logo/logo-primary-dark.svg"
                    alt="FreshFlow"
                />
            } @else {
                <!--
                  Primary wordmark (dark). Height = mark height × 1.51685281
                  so the cart mark matches the dense logo; width follows SVG ratio.
                -->
                <img
                    class="h-[calc(2rem*1.51685281)] w-auto"
                    src="images/logo/logo-primary-dark.svg"
                    alt="FreshFlow"
                />
            }
        </div>
    </ng-container>
</fuse-vertical-navigation>

<!-- Wrapper -->
<div class="flex w-full min-w-0 flex-auto flex-col">
    <!-- Header -->
    <div
        class="bg-card relative z-49 flex h-16 w-full flex-0 items-center px-4 shadow dark:border-b dark:bg-transparent dark:shadow-none md:px-6 print:hidden"
    >
        <div class="flex items-center space-x-2 pr-2">
            <!-- Navigation toggle button -->
            <button
                mat-icon-button
                (click)="toggleNavigation('mainNavigation')"
            >
                <mat-icon [svgIcon]="'heroicons_outline:bars-3'"></mat-icon>
            </button>
            <!-- Navigation appearance toggle button -->
            <button
                class="hidden md:inline-flex"
                mat-icon-button
                (click)="toggleNavigationAppearance()"
            >
                <mat-icon
                    [svgIcon]="'heroicons_outline:arrows-right-left'"
                ></mat-icon>
            </button>
        </div>
        <!-- Components -->
        <div class="ml-auto flex items-center space-x-0.5 pl-2 sm:space-x-2">
            <languages [appearance]="'flag'"></languages>
            <!-- Scheme (dark / light) toggle button -->
            <ng-container *transloco="let t">
                <button
                    mat-icon-button
                    (click)="toggleScheme()"
                    [matTooltip]="
                        scheme === 'dark'
                            ? t('header.lightMode')
                            : t('header.darkMode')
                    "
                >
                    <mat-icon
                        [svgIcon]="
                            scheme === 'dark'
                                ? 'heroicons_outline:sun'
                                : 'heroicons_outline:moon'
                        "
                    ></mat-icon>
                </button>
            </ng-container>
            <fuse-fullscreen class="hidden md:block"></fuse-fullscreen>
            <search [appearance]="'bar'"></search>
            <notifications></notifications>
            <user></user>
        </div>
    </div>

    <!-- Content -->
    <div class="flex flex-auto flex-col">
        <!-- *ngIf="true" hack is required here for router-outlet to work correctly.
             Otherwise, layout changes won't be registered and the view won't be updated! -->
        @if (true) {
            <router-outlet fuseRouteAnimation></router-outlet>
        }
    </div>

    <!-- Footer -->
    <div
        class="bg-card relative z-49 flex h-14 w-full flex-0 items-center justify-start border-t px-4 dark:bg-transparent md:px-6 print:hidden"
    >
        <span class="text-secondary font-medium">
            Bản quyền &copy; {{ currentYear }}
            <span class="font-semibold text-primary">FreshFlow</span>.
        </span>
    </div>
</div>
