<!-- Loading bar -->
<fuse-loading-bar></fuse-loading-bar>

<!-- Navigation -->
@if (isScreenSmall) {
    <fuse-vertical-navigation
        class="dark bg-gray-900 print:hidden"
        [mode]="'over'"
        [name]="'mainNavigation'"
        [navigation]="navigation.default"
        [opened]="false"
    >
        <ng-container fuseVerticalNavigationContentHeader>
            <div class="flex h-20 items-center px-8 pt-6">
                <img
                    class="w-24"
                    src="images/logo/logo-text-on-dark.svg"
                    alt="FreshFlow logo"
                />
            </div>
        </ng-container>
    </fuse-vertical-navigation>
}

<!-- Wrapper -->
<div
    class="enterprise-layout flex w-full min-w-0 flex-auto flex-col"
    [class.enterprise-layout--mobile-nav]="isScreenSmall"
>
    @if (navigation) {
        <enterprise-header
            class="w-full shrink-0"
            [isScreenSmall]="isScreenSmall"
            [navigation]="navigation.horizontal"
            (toggleNavigation)="toggleNavigation('mainNavigation')"
            (openSearch)="openSearch()"
            (openAiChat)="openAiChat()"
        ></enterprise-header>
    }

    <!-- Search overlay (mobile + fallback) -->
    <div class="enterprise-layout__search-host">
        <search #headerSearch [appearance]="'bar'"></search>
    </div>

    <!-- AI chat overlay (mobile) -->
    <div class="enterprise-layout__ai-chat-host">
        <enterprise-ai-chat #headerAiChat></enterprise-ai-chat>
    </div>

    <!-- Content -->
    <div
        class="enterprise-layout__content enterprise-container mx-auto flex w-full flex-auto flex-col"
    >
        @if (true) {
            <router-outlet></router-outlet>
        }
    </div>

    <!-- Footer -->
    <div
        class="enterprise-layout__footer w-full shrink-0 border-t print:hidden"
    >
        <div class="enterprise-container flex h-full w-full items-center">
            <span class="font-medium">FreshFlow &copy; {{ currentYear }}</span>
        </div>
    </div>
</div>
