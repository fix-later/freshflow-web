<div
    class="bg-default flex min-h-screen w-full flex-auto flex-col items-center justify-center gap-6 p-6 text-center sm:p-10"
    *transloco="let t"
>
    <div
        class="flex h-24 w-24 items-center justify-center rounded-full bg-red-100 dark:bg-red-900"
    >
        <mat-icon
            class="text-red-600 icon-size-12 dark:text-red-100"
            svgIcon="heroicons_outline:exclamation-triangle"
        ></mat-icon>
    </div>

    <div>
        <div
            class="text-7xl font-extrabold leading-none tracking-tight text-red-600 dark:text-red-400 sm:text-8xl"
        >
            500
        </div>
        <div class="mt-4 text-2xl font-bold tracking-tight sm:text-3xl">
            {{ t('errorPage.serverError.title') }}
        </div>
        <p class="text-secondary mx-auto mt-2 max-w-md text-base">
            {{ t('errorPage.serverError.description') }}
        </p>
    </div>

    <div class="mt-2 flex flex-wrap items-center justify-center gap-3">
        <button mat-stroked-button type="button" (click)="reload()">
            <mat-icon svgIcon="heroicons_outline:arrow-path"></mat-icon>
            <span class="ml-2">{{ t('errorPage.retry') }}</span>
        </button>
        <a mat-flat-button color="primary" routerLink="/home">
            <mat-icon svgIcon="heroicons_outline:home"></mat-icon>
            <span class="ml-2">{{ t('errorPage.home') }}</span>
        </a>
    </div>
</div>
