<ng-container *transloco="let t">
    <form [formGroup]="form" (ngSubmit)="save()" class="flex flex-col gap-4">
        <div class="flex items-center gap-4">
            @if (avatarUrl(); as avatar) {
                <img
                    [src]="avatar"
                    class="h-16 w-16 rounded-full object-cover"
                    [alt]="email()"
                />
            } @else {
                <mat-icon
                    class="text-hint icon-size-16"
                    svgIcon="heroicons_outline:user-circle"
                ></mat-icon>
            }
            <div class="flex min-w-0 flex-col">
                <span class="text-secondary text-sm">{{
                    t('accountInfo.email')
                }}</span>
                <span class="truncate font-medium">{{ email() }}</span>
                <div class="mt-1 flex items-center gap-1">
                    <button
                        mat-button
                        type="button"
                        [disabled]="uploading()"
                        (click)="avatarInput.click()"
                    >
                        @if (uploading()) {
                            <mat-icon
                                class="animate-spin icon-size-5"
                                svgIcon="heroicons_outline:arrow-path"
                            ></mat-icon>
                        }
                        <span>{{
                            avatarUrl()
                                ? t('accountInfo.avatarChange')
                                : t('accountInfo.avatarUpload')
                        }}</span>
                    </button>
                    @if (avatarUrl()) {
                        <button
                            mat-button
                            type="button"
                            [disabled]="uploading()"
                            (click)="removeAvatar()"
                        >
                            {{ t('accountInfo.avatarRemove') }}
                        </button>
                    }
                </div>
            </div>
            <input
                #avatarInput
                class="hidden"
                type="file"
                accept="image/*"
                (change)="onAvatarPicked($event)"
            />
        </div>

        <mat-form-field subscriptSizing="dynamic">
            <mat-label>{{ t('accountInfo.fullName') }}</mat-label>
            <input matInput formControlName="fullName" />
        </mat-form-field>

        <mat-form-field subscriptSizing="dynamic">
            <mat-label>{{ t('accountInfo.phone') }}</mat-label>
            <input matInput formControlName="phone" />
        </mat-form-field>

        <div class="flex justify-end">
            <button
                mat-flat-button
                color="primary"
                type="submit"
                [disabled]="saving()"
            >
                @if (saving()) {
                    <mat-icon
                        class="animate-spin icon-size-5"
                        svgIcon="heroicons_outline:arrow-path"
                    ></mat-icon>
                }
                <span>{{ t('accountInfo.save') }}</span>
            </button>
        </div>
    </form>
</ng-container>
