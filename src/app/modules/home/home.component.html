<div class="ff-landing" *transloco="let t">
    <!-- 1. Bước vào chợ -->
    <market-hero data-testid="landing-hero"></market-hero>

    <!-- 2. Hàng đẹp hôm nay -->
    <today-highlights data-testid="landing-today"></today-highlights>

    <!-- 3. Đi một vòng quanh chợ -->
    <market-zones data-testid="landing-zones"></market-zones>

    <!-- 4. Mỗi chợ một thế mạnh -->
    <market-specialties data-testid="landing-markets"></market-specialties>

    <!-- 5. Mọi người thường mua. Anchored so section 6 can bring the buyer
         back up to it after they pick a kitchen type. -->
    <div #basketSection>
        <recommended-basket
            data-testid="landing-basket"
            [businessKindId]="selectedKindId()"
        ></recommended-basket>
    </div>

    <!-- 6. Mai bán gì? -->
    <tomorrow-menu
        data-testid="landing-tomorrow"
        (kindSelected)="onKindSelected($event)"
    ></tomorrow-menu>

    <!-- 7. Đơn hàng ngày mai -->
    <order-cutoff data-testid="landing-cutoff"></order-cutoff>

    <!-- 8. Freshflow đi chợ thế nào? -->
    <freshflow-process data-testid="landing-process"></freshflow-process>

    <!-- 9. Final CTA. Inline: a headline and one button. -->
    <section class="ff-landing-cta" data-testid="landing-final-cta">
        <div class="ff-landing-cta__inner">
            <div class="ff-landing-cta__copy">
                <h2 class="ff-landing-cta__title">
                    {{ t('home.finalCta.title') }}
                </h2>
                <p class="ff-landing-cta__lead">
                    {{ t('home.finalCta.lead') }}
                </p>
            </div>
            <a class="ff-landing-cta__action" routerLink="/catalog">
                <span>{{ t('home.finalCta.action') }}</span>
                <mat-icon
                    class="text-current icon-size-5"
                    [svgIcon]="'heroicons_outline:arrow-right'"
                ></mat-icon>
            </a>
        </div>
    </section>
</div>
