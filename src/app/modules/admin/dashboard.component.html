<div class="flex w-full flex-col p-6 md:p-8" *transloco="let t">
    <h1 class="text-3xl font-bold tracking-tight">
        {{ t('admin.dashboard.title') }}
    </h1>
    <p class="text-secondary mt-2">
        {{ t('admin.dashboard.subtitle') }}
    </p>

    <div class="mt-8 grid grid-cols-1 gap-4 sm:grid-cols-2 lg:max-w-3xl">
        @for (card of cards; track card.link) {
            <a
                [routerLink]="card.link"
                class="group bg-card flex flex-col rounded-2xl border p-6 shadow-sm transition-shadow hover:shadow-md"
            >
                <div
                    class="flex h-12 w-12 items-center justify-center rounded-xl bg-primary/10 text-primary"
                >
                    <mat-icon [svgIcon]="card.icon"></mat-icon>
                </div>
                <h2 class="mt-4 text-lg font-semibold">
                    {{ t(card.titleKey) }}
                </h2>
                <p class="text-secondary mt-1 text-sm">
                    {{ t(card.descriptionKey) }}
                </p>
            </a>
        }
    </div>
</div>
