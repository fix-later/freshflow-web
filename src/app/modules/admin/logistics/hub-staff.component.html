<div class="flex w-full flex-col p-6 md:p-8" *transloco="let t">
    <button mat-button class="-ml-3 self-start" (click)="goBack()">
        <mat-icon
            class="mr-1"
            svgIcon="heroicons_outline:arrow-left"
        ></mat-icon>
        {{ t('admin.hubStaff.back') }}
    </button>

    <h1 class="mt-2 text-3xl font-bold tracking-tight">
        {{ t('admin.hubStaff.title') }}
    </h1>
    <p class="text-secondary mt-2">
        {{ t('admin.hubStaff.subtitle', { hub: hubName() }) }}
    </p>

    @if (loading()) {
        <mat-progress-bar mode="indeterminate" class="mt-6"></mat-progress-bar>
    } @else {
        <div class="bg-card mt-6 flex flex-col gap-4 rounded-2xl border p-6">
            @if (staff().length) {
                <div
                    class="grid grid-cols-1 gap-3 sm:grid-cols-2 lg:grid-cols-3"
                >
                    @for (member of staff(); track member.value) {
                        <mat-checkbox
                            color="primary"
                            [checked]="isAssigned(member.value)"
                            (change)="toggle(member.value)"
                        >
                            {{ member.label }}
                        </mat-checkbox>
                    }
                </div>
                <button
                    mat-flat-button
                    color="accent"
                    class="self-end"
                    [disabled]="saving()"
                    (click)="save()"
                >
                    {{ t('admin.hubStaff.save') }}
                </button>
            } @else {
                <p class="text-secondary">{{ t('admin.hubStaff.empty') }}</p>
            }
        </div>
    }
</div>
