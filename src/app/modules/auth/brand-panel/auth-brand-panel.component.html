<div
    class="relative flex h-full min-h-full w-full flex-1 flex-col overflow-hidden bg-[#083B4B] p-10 lg:p-12"
    *transloco="let t"
>
    <!-- Dot grid, top-right -->
    <!-- prettier-ignore -->
    <!-- Mint (accent), not primary: navy on the dark brand panel is invisible -->
    <svg
        class="absolute right-8 top-8 text-accent/60"
        viewBox="0 0 220 152"
        width="160"
        height="110"
        fill="none"
        aria-hidden="true"
    >
        <defs>
            <pattern
                id="auth-brand-dots"
                x="0"
                y="0"
                width="20"
                height="20"
                patternUnits="userSpaceOnUse"
            >
                <rect
                    x="0"
                    y="0"
                    width="4"
                    height="4"
                    fill="currentColor"
                ></rect>
            </pattern>
        </defs>
        <rect width="220" height="152" fill="url(#auth-brand-dots)"></rect>
    </svg>

    <!-- Soft brand wash -->
    <div
        class="pointer-events-none absolute -bottom-24 -right-16 h-80 w-80 rounded-full bg-[#0A5A6E] opacity-50 blur-3xl"
        aria-hidden="true"
    ></div>
    <div
        class="pointer-events-none absolute bottom-20 right-10 h-40 w-40 rounded-full bg-accent opacity-10 blur-2xl"
        aria-hidden="true"
    ></div>

    <!-- Decorative brand leaves -->
    <img
        class="pointer-events-none absolute -right-16 bottom-10 w-80 rotate-12 opacity-25"
        src="images/splashscreen/leaf.svg"
        alt=""
    />
    <img
        class="pointer-events-none absolute -bottom-24 right-36 w-72 -rotate-45 opacity-10"
        src="images/splashscreen/leaf.svg"
        alt=""
    />

    <!-- Logo -->
    <img
        class="relative z-10 w-36"
        src="images/logo/logo-primary-dark.svg"
        alt="FreshFlow logo"
    />

    <!-- Title block -->
    <div class="relative z-10 my-auto py-12">
        <h1
            class="text-5xl font-extrabold leading-none tracking-tight text-white lg:text-6xl"
        >
            FreshFlow
        </h1>
        <div
            class="mt-2 text-2xl font-bold leading-tight text-accent lg:text-3xl"
        >
            {{ t('auth.panel.tagline') }}
        </div>
        <p
            class="mt-6 max-w-md text-base leading-relaxed text-gray-300 lg:text-lg"
        >
            {{ t('auth.panel.description') }}
        </p>
    </div>

    <!-- Copyright -->
    <div class="relative z-10 text-sm text-gray-400">
        {{ t('auth.panel.copyright', { year: year }) }}
    </div>
</div>
