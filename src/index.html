<!doctype html>
<html lang="en">
    <head>
        <title>Fresh Flow</title>
        <meta charset="utf-8" />
        <meta name="description" content="Fresh Flow" />
        <meta name="keywords" content="Fresh Flow" />
        <meta
            name="viewport"
            content="width=device-width, height=device-height, initial-scale=1.0, minimum-scale=1.0"
        />

        <base href="/" />

        <!-- Critical splash styles: inlined so scrolling is locked from the
             very first paint, before the external splash-screen.css loads —
             otherwise the page flashes scrollbars for a few frames. The lock
             is unconditional so it applies the instant <html> is parsed (a
             conditional :has(body ...) selector wouldn't match yet, since
             <body> doesn't exist during head parsing).

             Scrolling is released only once the app is ready (Fuse adds
             .fuse-splash-screen-hidden to <body>) AND the splash is truly
             gone (its JS lifecycle clears .ff-splash-active on the
             <fuse-splash-screen> element). The ready class alone lands while
             the splash is still visible/fading, which would flash the page's
             scrollbars underneath it. -->
        <style>
            html,
            body {
                overflow: hidden;
            }
            html:has(body.fuse-splash-screen-hidden):not(
                    :has(fuse-splash-screen.ff-splash-active)
                ),
            body.fuse-splash-screen-hidden:not(
                    :has(fuse-splash-screen.ff-splash-active)
                ) {
                overflow: visible;
            }
        </style>

        <!-- Favicon -->
        <link rel="icon" type="image/png" href="favicon-16x16.png?v=2" />
        <link rel="icon" type="image/png" href="favicon-32x32.png?v=2" />

        <!-- Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

        <link
            href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&display=swap"
            rel="stylesheet"
        />
        <link
            href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap"
            rel="stylesheet"
        />

        <!-- Icon fonts -->
        <link
            href="https://fonts.googleapis.com/icon?family=Material+Icons"
            rel="stylesheet"
        />
    </head>

    <body>
        <!-- Splash screen: plain brand background until the bundle
             executes; @fuse/services/splash-screen/animation then plays the logo reveal sequence. -->
        <fuse-splash-screen></fuse-splash-screen>

        <!-- App root -->
        <app-root></app-root>
    </body>
</html>
